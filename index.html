<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Product Gallery</h1>
        <button id="themeToggle">Dark Mode</button>
    </header>

    <main class="gallery">
        <div class="product-card fade-in">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80" alt="Running Shoes">
            <div class="product-info">
                <h2>Running Shoes</h2>
                <p>Comfortable and lightweight shoes for everyday running.</p>
                <span class="price">$89.99</span>
                <button class="buy-btn">Buy Now</button>
            </div>
        </div>

        <div class="product-card fade-in">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80" alt="Smart Watch">
            <div class="product-info">
                <h2>Smart Watch</h2>
                <p>Track your activity, notifications, and daily progress.</p>
                <span class="price">$129.99</span>
                <button class="buy-btn">Buy Now</button>
            </div>
        </div>

        <div class="product-card fade-in">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80" alt="Headphones">
            <div class="product-info">
                <h2>Wireless Headphones</h2>
                <p>Enjoy clear sound with comfortable wireless listening.</p>
                <span class="price">$74.99</span>
                <button class="buy-btn">Buy Now</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
